{% extends "base.html" %}
{% block title %}Sign in — Track4U{% endblock %}

{% block content %}
<div style="max-width:360px; margin:64px auto;">

    <div style="margin-bottom:28px;">
        <h1 style="font-size:22px; font-weight:700; color:#e8e8e8; margin:0 0 6px; letter-spacing:-0.02em;">Welcome back</h1>
        <p style="font-size:13.5px; color:#555; margin:0;">Sign in to your workspace</p>
    </div>

    <div class="card" style="padding:28px;">
        <div id="login-error" class="err-box" style="display:none; margin-bottom:18px;"></div>

        <form id="login-form" onsubmit="event.preventDefault(); submitLogin();" style="display:flex; flex-direction:column; gap:16px;">
            <div>
                <label style="display:block; font-size:11.5px; font-weight:700; color:#555; margin-bottom:7px; text-transform:uppercase; letter-spacing:0.07em;">Email</label>
                <input type="email" id="email" required placeholder="you@example.com"
                    class="field" style="width:100%; padding:10px 12px;">
            </div>
            <div>
                <label style="display:block; font-size:11.5px; font-weight:700; color:#555; margin-bottom:7px; text-transform:uppercase; letter-spacing:0.07em;">Password</label>
                <input type="password" id="password" required
                    class="field" style="width:100%; padding:10px 12px;">
            </div>
            <button type="submit" class="btn-primary" style="padding:11px; font-size:14px; margin-top:4px;">
                Sign in
            </button>
        </form>
    </div>

    <p style="text-align:center; margin-top:20px; font-size:13px; color:#555;">
        No account?
        <a href="/signup" class="text-accent" style="font-weight:600; text-decoration:none;">Create one free</a>
    </p>
</div>

<script>
async function submitLogin() {
    const errDiv = document.getElementById("login-error");
    errDiv.style.display = "none";
    try {
        const res = await fetch("/api/v1/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                email: document.getElementById("email").value,
                password: document.getElementById("password").value
            })
        });
        if (!res.ok) {
            const d = await res.json();
            errDiv.textContent = d.detail || "Login failed. Check your credentials.";
            errDiv.style.display = "block";
        } else {
            window.location.href = "/projects-view";
        }
    } catch {
        errDiv.textContent = "Network error — is the server running?";
        errDiv.style.display = "block";
    }
}
</script>
{% endblock %}
