<div class="bg-slate-900/90 rounded-lg p-4 border border-slate-800 hover:border-slate-700 transition shadow-sm space-y-3">
    <div class="flex items-start justify-between gap-2">
        <a href="/tasks-view/{{ task.id }}" class="font-bold text-white text-sm hover:text-indigo-400 transition line-clamp-2">
            {{ task.title }}
        </a>
        <div class="flex items-center gap-1.5 flex-shrink-0">
            <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider
                {% if task.priority == 'urgent' %}bg-rose-950/80 text-rose-400 border border-rose-800/50
                {% elif task.priority == 'high' %}bg-amber-950/80 text-amber-400 border border-amber-800/50
                {% elif task.priority == 'medium' %}bg-blue-950/80 text-blue-400 border border-blue-800/50
                {% else %}bg-slate-800 text-slate-400{% endif %}">
                {{ task.priority }}
            </span>
            <!-- Edit button -->
            <button
                onclick="openEditTaskModal('{{ task.id }}', '{{ task.title | replace("'", "\\'") }}', '{{ (task.description or '') | replace("'", "\\'") }}', '{{ task.status }}', '{{ task.priority }}', '{{ task.due_date or '' }}', '{{ (task.alert_emails or '') | replace("'", "\\'") }}', {{ task.alert_days_before or 3 }})"
                class="px-1.5 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs transition"
                title="Edit Task">
                ✏️
            </button>
            <!-- Delete button -->
            <button
                onclick="deleteTask('{{ task.id }}', '{{ task.title | replace("'", "\\'") }}')"
                class="px-1.5 py-0.5 rounded bg-slate-800 hover:bg-rose-900/50 text-slate-400 hover:text-rose-300 text-xs transition"
                title="Delete Task">
                🗑️
            </button>
        </div>
    </div>

    {% if task.description %}
    <p class="text-slate-400 text-xs line-clamp-2">{{ task.description }}</p>
    {% endif %}

    <!-- Footer: Due date + Status dropdown -->
    <div class="flex items-center justify-between pt-2 border-t border-slate-800/60 text-[11px] text-slate-400">
        <div class="flex items-center gap-2">
            {% if task.due_date %}
            <span>📅 {{ task.due_date.strftime('%b %d') }}</span>
            {% else %}
            <span>No due date</span>
            {% endif %}
            {% if task.alert_emails %}
            <span title="Alert emails: {{ task.alert_emails }}" class="text-indigo-400 text-[11px]">🔔</span>
            {% endif %}
        </div>

        <!-- Direct Status Dropdown -->
        <div class="flex items-center gap-1">
            <select
                onchange="updateTaskStatus('{{ task.id }}', this.value)"
                class="bg-slate-800 text-slate-200 text-[11px] font-semibold rounded border border-slate-700 px-2 py-0.5 focus:outline-none focus:border-indigo-500 cursor-pointer hover:border-slate-600 transition">
                <option value="todo" {{ 'selected' if task.status == 'todo' }}>📌 To Do</option>
                <option value="in_progress" {{ 'selected' if task.status == 'in_progress' }}>⚡ In Progress</option>
                <option value="done" {{ 'selected' if task.status == 'done' }}>✅ Done</option>
            </select>
        </div>
    </div>
</div>
